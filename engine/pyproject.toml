[project]
name = "karaoke-engine"
version = "0.1.0"
description = "노래방 프로그램의 파이썬 처리기 (곡 관리, 반주 분리, 가사)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mutagen>=1.47",
    "audio-separator[gpu]>=0.30",
    "audioread>=3.1.0",
    "faster-whisper>=1.2.1",
]

# PyTorch는 PC에 맞는 것 하나만 받는다 (설치판이 처음 켤 때 고른다): NVIDIA(CUDA 12.8 드라이버)면 cu128, 아니면 cpu
[project.optional-dependencies]
cu128 = ["torch==2.8.0", "torchaudio==2.8.0"]
cpu = ["torch==2.8.0", "torchaudio==2.8.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
karaoke-engine = "karaoke_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["karaoke_engine"]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cu128" }, { index = "pytorch-cpu", extra = "cpu" }]
torchaudio = [{ index = "pytorch-cu128", extra = "cu128" }, { index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
