# 설치 파일을 공개 소스에서 빌드한다 (무료 코드 서명 SignPath Foundation의 조건: 검증할 수 있는 자동 빌드)
# 태그 v* 를 올리거나 Actions 화면에서 직접 실행한다. 결과는 이 실행의 Artifacts(noritune-setup)
# 업데이트 서명(.sig)은 코드 서명이 끝난 설치 파일에 따로 만든다 (코드 서명이 파일 내용을 바꾸므로)
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # app/src-tauri/.cargo/config.toml 의 개발 PC 경로 대신
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: 함께 넣을 프로그램 받기 (판 고정)
        shell: pwsh
        run: ./scripts/fetch_bins.ps1 -Out "$env:RUNNER_TEMP\bin"

      - name: 설치 파일 빌드
        shell: pwsh
        working-directory: app
        run: |
          npm ci
          # tauri.conf.json 의 개발 PC 경로(bin)를 이 실행의 경로로 바꾸고, 업데이트 서명은 여기서 하지 않는다
          $bin = "$env:RUNNER_TEMP/bin/".Replace('\', '/')
          $resources = [ordered]@{ "C:/Users/osj00/.cache/karaoke/bin/" = $null }
          $resources[$bin] = "bin/"
          @{ bundle = @{ createUpdaterArtifacts = $false; resources = $resources } } | ConvertTo-Json -Depth 5 | Set-Content ci.json
          Get-Content ci.json
          npx tauri build --config ci.json

      - name: 결과 확인
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe
          $exe | Format-Table Name, Length
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: noritune-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
